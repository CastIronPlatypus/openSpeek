<!doctype html><meta charset="utf-8"><title>engine harness</title>
<script type="module">
import { getEngine } from './index.ts';
const out = (window.__result = { progress: [], logs: [] });
try {
  const engine = getEngine('phonon');
  let t = performance.now();
  const voices = await engine.listVoices();
  out.voiceCount = voices.length; out.firstVoices = voices.slice(0, 3).map(v => v.name);
  out.voicesMs = performance.now() - t;
  t = performance.now();
  await engine.load(p => out.progress.push(p));
  out.loadMs = performance.now() - t;
  out.info = engine.info; out.isolated = crossOriginIsolated;
  const rms = a => Math.sqrt(a.reduce((s, x) => s + x * x, 0) / a.length);
  const text = 'The quick brown fox jumps over the lazy dog, and then it takes a nap in the warm afternoon sun.';
  for (const voice of [null, voices[0]?.name, null]) {
    t = performance.now();
    const { pcm } = await engine.synth(text, { voice });
    const ms = performance.now() - t; const secs = pcm.length / engine.sampleRate;
    out.logs.push({ voice, samples: pcm.length, audioSec: secs, ms, rtf: ms / 1000 / secs, rms: rms(pcm) });
  }
  const c = new AbortController(); const p = engine.synth(text, { signal: c.signal }); setTimeout(() => c.abort(), 200);
  try { await p; out.abort = 'resolved?!'; } catch (e) { out.abort = e.name; }
  const silent = await engine.synth('...'); out.silence = silent.pcm.length;
} catch (e) { out.error = String(e && e.stack || e); }
out.done = true;
</script>
